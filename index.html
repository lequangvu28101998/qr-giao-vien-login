<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>QR Giáo Viên</title>

  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;

      font-family: Arial, sans-serif;
      background: #f5f7fa;
    }

    .box {
      width: min(92%, 460px);
      background: #ffffff;
      border-radius: 18px;
      padding: 40px 30px;

      text-align: center;

      box-shadow:
        0 4px 20px rgba(0, 0, 0, 0.08);
    }

    .icon {
      font-size: 52px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 28px;
      color: #222;
    }

    .description {
      margin: 0 0 28px;
      color: #666;
      line-height: 1.5;
      font-size: 15px;
    }

    .qr-info {
      margin-bottom: 25px;
      padding: 12px 16px;

      background: #f1f5ff;
      border-radius: 10px;

      color: #444;
      font-size: 14px;
    }

    .qr-info strong {
      color: #1a73e8;
    }

    #google-login {
      display: flex;
      justify-content: center;
    }

    .status {
      margin-top: 20px;
      font-size: 14px;
      color: #777;
      min-height: 20px;
    }

    .error {
      margin-top: 18px;
      padding: 12px 14px;

      background: #fff1f1;
      color: #c62828;

      border-radius: 10px;
      font-size: 14px;

      display: none;
    }
  </style>
</head>

<body>

  <div class="box">

    <div class="icon">
      🔐
    </div>

    <h1>
      Xác thực tài khoản
    </h1>

    <p class="description">
      Vui lòng chọn tài khoản Google để tiếp tục
      xem hồ sơ giáo viên.
    </p>

    <div class="qr-info">
      Mã QR:
      <strong id="qr-id">Đang tải...</strong>
    </div>

    <div id="google-login"></div>

    <div class="status" id="status">
      Đang tải...
    </div>

    <div class="error" id="error">
      Không thể khởi tạo đăng nhập Google.
    </div>

  </div>

  <script>

    /*
     * ==========================================
     * CẤU HÌNH
     * ==========================================
     */

    const GOOGLE_CLIENT_ID =
      'YOUR_CLIENT_ID.apps.googleusercontent.com';


    /*
     * ==========================================
     * LẤY QR ID TỪ URL
     * ==========================================
     */

    const params =
      new URLSearchParams(window.location.search);

    const qrId =
      params.get('id') || '';


    document.getElementById('qr-id').textContent =
      qrId || 'Không xác định';


    /*
     * ==========================================
     * HIỂN THỊ THÔNG TIN TRẠNG THÁI
     * ==========================================
     */

    function setStatus(message) {

      const status =
        document.getElementById('status');

      status.textContent = message;

    }


    function showError(message) {

      const error =
        document.getElementById('error');

      error.textContent = message;

      error.style.display = 'block';

    }


    /*
     * ==========================================
     * CALLBACK SAU KHI GOOGLE XÁC THỰC
     * ==========================================
     */

    function handleCredentialResponse(response) {

      if (!response || !response.credential) {

        showError(
          'Không nhận được thông tin xác thực từ Google.'
        );

        return;
      }


      setStatus(
        'Đã chọn tài khoản. Đang xác thực...'
      );


      /*
       * TẠM THỜI
       *
       * Ở bước tiếp theo chúng ta sẽ gửi
       * response.credential sang
       * QR Giáo Viên - AUTH để xác minh.
       *
       * Chưa chuyển hướng ở đây.
       */


      console.log(
        'Google ID Token:',
        response.credential
      );


      setStatus(
        'Đã nhận tài khoản Google.'
      );

    }


    /*
     * ==========================================
     * KHỞI TẠO GOOGLE IDENTITY SERVICES
     * ==========================================
     */

    function initializeGoogleLogin() {

      if (
        typeof google === 'undefined' ||
        !google.accounts ||
        !google.accounts.id
      ) {

        showError(
          'Google Identity Services chưa tải xong.'
        );

        return;
      }


      if (
        !GOOGLE_CLIENT_ID ||
        GOOGLE_CLIENT_ID ===
          'YOUR_CLIENT_ID.apps.googleusercontent.com'
      ) {

        showError(
          'Chưa cấu hình Google Client ID.'
        );

        setStatus('');

        return;
      }


      google.accounts.id.initialize({

        client_id: GOOGLE_CLIENT_ID,

        callback:
          handleCredentialResponse,

        auto_select: false,

        cancel_on_tap_outside: false

      });


      google.accounts.id.renderButton(

        document.getElementById(
          'google-login'
        ),

        {
          theme: 'outline',
          size: 'large',
          shape: 'rectangular',
          text: 'signin_with',
          logo_alignment: 'left',
          width: 300
        }

      );


      setStatus(
        'Vui lòng chọn tài khoản Google.'
      );

    }


    /*
     * ==========================================
     * CHỜ GOOGLE GIS TẢI
     * ==========================================
     */

    window.addEventListener(
      'load',
      function () {

        setTimeout(
          initializeGoogleLogin,
          500
        );

      }
    );

  </script>

</body>
</html>
